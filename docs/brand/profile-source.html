<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;display:flex;gap:40px;padding:40px;background:#ddd;flex-wrap:wrap;width:3600px}

svg{position:absolute;inset:0;width:800px;height:800px}
</style></head><body>

<div class="c" id="N1" style="background:#F5C842"><svg viewBox="0 0 800 800">
<path d="M150 390 L400 170 L650 390" fill="none" stroke="#24211C" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>

<div class="c" id="N2" style="background:#24211C"><svg viewBox="0 0 800 800">

<path d="M300 420 L370 490 L505 350" fill="none" stroke="#24211C" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/></g>
<rect x="300" y="160" width="200" height="70" fill="#F5C842" transform="rotate(4 400 195)"/></svg></div>

<div class="c" id="N4" style="background:#FBF7EE"><svg viewBox="0 0 800 800">

<rect x="305" y="650" width="190" height="34" rx="12" fill="#24211C"/><rect x="330" y="700" width="140" height="30" rx="12" fill="#24211C"/>

<path d="M325 380 V520 H475 V380" fill="none" stroke="#24211C" stroke-width="36" stroke-linejoin="round"/></svg></div>
