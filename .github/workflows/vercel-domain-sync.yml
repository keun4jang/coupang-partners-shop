# Vercel 프로덕션 도메인 자동 재연결.
#
# 프로젝트를 momitemmom 으로 리네임하면서 momitemmom.vercel.app 도메인이
# Vercel 의 "새 배포마다 자동 갱신" 목록에서 빠졌다(내부 링크 유실 - 리네임 버그).
# 그래서 빌드/배포는 항상 성공하는데 실제 도메인은 예전 배포에 멈춰 있었다.
#
# 완전한 근본 수정(도메인 삭제 후 재등록)은 순간적으로 사이트가 내려갈 수 있어
# 보류하고, 대신 이 워크플로가 푸시마다 최신 프로덕션 배포를 찾아
# momitemmom.vercel.app 에 재연결한다(`vercel alias set`) - 다운타임 없음.
#
# 필요한 것: 저장소 Settings → Secrets and variables → Actions 에
#   VERCEL_TOKEN = Vercel 개인 액세스 토큰 (https://vercel.com/account/tokens)
# 이 시크릿이 없으면 아무것도 하지 않고 조용히 종료한다.
#
# 문제를 만나면(2026-11-15 사장님 "문제를 텔레그램에 보내면서 해결도 하고 해결된 것까지 보내줘"):
#   🚨 문제 알림 → 스스로 고치기(운영 브랜치 맨 위 커밋 배포로 다시 연결·승격) → ✅ 해결됨 / ❌ 못 고침 알림.
#   못 고친 뒤 다음 실행이 성공하면 그때 ✅ 해결됨을 보낸다.
# 거짓 경보 막기: 커밋이 연달아 올라오면 Vercel 은 앞 커밋 배포를 건너뛴다(11/15 15:31 실측 -
#   14초 뒤 커밋이 올라와 앞 커밋 배포가 안 생겼고, 15분 기다리다 🚨가 갔지만 사이트는 이미 최신이었다).
#   그래서 ① 새 실행이 오면 옛 실행은 취소하고 ② 기다리는 동안 더 새 커밋이 올라왔으면 조용히 넘긴다.

name: vercel-domain-sync

on:
  workflow_dispatch:
  push:
    branches:
      - claude/coupang-partners-shortform-hinfcb

# project/team id 는 비밀정보 아님(공개 식별자) - 시크릿 아닌 값으로 둔다.
env:
  VERCEL_PROJECT_ID: prj_fToV2H7YJsGLIIQPdr7EhzrepHVl
  VERCEL_TEAM_SCOPE: rmsduddl200-2456s-projects
  VERCEL_TEAM_ID: team_K9RrJcr1OyeJodEA9g34IAKO
  VERCEL_DOMAIN: momitemmom.vercel.app

# 커밋이 연달아 올라오면 앞 실행은 취소 - 새 실행이 더 새 배포를 연결한다(취소는 알림 없음)
concurrency:
  group: vercel-domain-sync
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  sync-domain:
    runs-on: ubuntu-latest
    # 배포 대기 15분 + 문제 때 스스로 고치기 10분 + 설치·승격 여유
    timeout-minutes: 32
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: ${{ github.ref_name }}
      SH: scripts/vercel-domain-sync.sh
    steps:
      - name: 토큰 확인
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN 시크릿이 없어 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
        with:
          sparse-checkout: scripts/vercel-domain-sync.sh
          sparse-checkout-cone-mode: false

      - name: 이 커밋의 배포가 준비될 때까지 대기 후 도메인 재연결 (문제면 스스로 고침)
        id: sync
        if: steps.check.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
          GIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "커밋 $GIT_SHA 의 Vercel 배포 대기 중..."
          URL=""; DEP_ID=""; HICCUPS=0; PROBLEM=""
          for i in $(seq 1 90); do
            read -r STATE U ID <<< "$(bash $SH find "$GIT_SHA")"
            case "${STATE:-}" in
              READY) URL="$U"; DEP_ID="$ID"; echo "배포 준비됨: $URL"; break ;;
              ERR) HICCUPS=$((HICCUPS + 1)); echo "[$i/90] Vercel API 일시 오류 - 다음 차례에 다시 (누적 $HICCUPS회)" ;;
              ERROR) PROBLEM="이 커밋의 배포(빌드)가 실패했어요"; break ;;
              CANCELED) PROBLEM="이 커밋의 배포가 취소됐어요"; break ;;
              *) echo "[$i/90] 아직 준비 안 됨 - 10초 후 재시도" ;;
            esac
            # 1분마다: 더 새 커밋이 올라왔으면 이 커밋은 건너뛴다 - 새 커밋의 실행이 연결한다
            if [ $((i % 6)) = 0 ]; then
              H=$(bash $SH head)
              if [ -n "$H" ] && [ "$H" != "$GIT_SHA" ]; then
                echo "더 새 커밋(${H:0:7})이 올라왔어요 - 이 커밋은 건너뛰고 새 실행에 맡깁니다(문제 아님)"
                exit 0
              fi
            fi
            sleep 10
          done
          [ -n "$URL" ] || [ -n "$PROBLEM" ] || PROBLEM="15분 기다려도 이 커밋의 배포가 준비되지 않았어요"

          if [ -z "$PROBLEM" ]; then
            if bash $SH link "$URL" "$DEP_ID"; then
              echo "hiccups=$HICCUPS" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            PROBLEM="최신 배포에 도메인 연결·프로덕션 승격이 안 됐어요"
          fi

          # 더 새 커밋이 올라와서 생긴 일이면 문제가 아니다
          H=$(bash $SH head)
          if [ -n "$H" ] && [ "$H" != "$GIT_SHA" ] && [ -z "$URL" ]; then
            echo "더 새 커밋(${H:0:7})이 올라와 이 커밋 배포가 건너뛰어졌어요 - 새 실행에 맡깁니다(문제 아님)"
            exit 0
          fi

          # ① 문제 알림 → ② 스스로 고치기 → ③ 결과 알림 (사장님 2026-11-15)
          bash $SH tg "🚨 시스템 문제 발생 → 지금 자동으로 고치는 중

          어디서: 웹사이트 도메인 동기화 (vercel-domain-sync)
          무엇이: ${PROBLEM}. 그대로 두면 사이트·크론이 옛 배포에 멈춰요.
          지금: 운영 브랜치 맨 위 커밋 배포로 다시 연결해 볼게요(최대 10분). 결과도 바로 알려드려요."
          echo "::warning::${PROBLEM} - 스스로 고치기 시작"
          H=$(bash $SH head); H=${H:-$GIT_SHA}
          WHY=""
          if OUT=$(bash $SH wait "$H" 600 2>/tmp/why); then
            read -r U2 ID2 <<< "$OUT"
            if bash $SH link "$U2" "$ID2"; then
              bash $SH tg "✅ 해결됨 (조치 필요 없음)

          어디서: 웹사이트 도메인 동기화 (vercel-domain-sync)
          무엇을 했나: 커밋 ${H:0:7} 배포로 도메인을 다시 연결하고 프로덕션으로 올렸어요. 사이트·크론 모두 최신이에요."
              echo "fixed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            WHY="도메인 연결·승격이 계속 실패"
          else
            case "$(cat /tmp/why)" in
              build_error) WHY="맨 위 커밋도 빌드가 실패했어요 - 코드 문제일 가능성이 커요" ;;
              canceled) WHY="맨 위 커밋 배포도 취소됐어요" ;;
              *) WHY="맨 위 커밋 배포도 10분 안에 준비되지 않았어요 - Vercel 쪽 지연일 수 있어요" ;;
            esac
          fi
          echo "why=$WHY" >> "$GITHUB_OUTPUT"
          echo "::error::스스로 못 고침: $WHY"
          exit 1

      # 일시 오류가 있었지만 다시 시도해 해결됐으면 "해결됨"도 알린다
      - name: 자동 복구 알림
        if: success() && steps.sync.outputs.hiccups != '' && steps.sync.outputs.hiccups != '0'
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
          HICCUPS: ${{ steps.sync.outputs.hiccups }}
        run: |
          bash $SH tg "🔧 자동 복구됨 (조치 필요 없음)

          어디서: 웹사이트 도메인 동기화 (vercel-domain-sync)
          무엇이: Vercel 응답이 ${HICCUPS}번 멈췄지만 자동으로 다시 시도해 최신 배포 연결·프로덕션 승격까지 끝냈어요."

      # 지난번에 못 고치고 끝났는데(빨간 실행) 이번에 됐으면 "해결됨"을 보낸다
      - name: 지난 문제 해결 알림
        if: success() && steps.check.outputs.ready == 'true' && steps.sync.outputs.fixed != '1'
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
          RUN_ID: ${{ github.run_id }}
        run: |
          LAST=$(curl -sS --max-time 20 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/vercel-domain-sync.yml/runs?status=completed&per_page=20" \
            | RUN_ID="$RUN_ID" node -e "
              try {
                const runs = JSON.parse(require('fs').readFileSync(0, 'utf8')).workflow_runs || [];
                // 끝난 순서로 본다. 취소된 건 문제가 아니라 빼고 본다.
                const done = runs.filter((r) => String(r.id) !== process.env.RUN_ID && ['success', 'failure'].includes(r.conclusion))
                  .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
                if (done[0] && done[0].conclusion === 'failure') process.stdout.write(done[0].html_url);
              } catch {}
            ") || true
          if [ -n "$LAST" ]; then
            bash $SH tg "✅ 해결됨 (조치 필요 없음)

          어디서: 웹사이트 도메인 동기화 (vercel-domain-sync)
          무엇이: 지난번 실패(${LAST}) 뒤 이번 실행에서 최신 배포 연결·프로덕션 승격까지 끝났어요. 사이트·크론 모두 최신이에요."
          else
            echo "지난 실행에 남은 문제 없음"
          fi

      # 스스로 못 고쳤을 때만 (사람이 봐야 함)
      - name: 못 고쳤을 때 텔레그램 알림
        if: failure()
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
          WHY: ${{ steps.sync.outputs.why }}
        run: |
          bash $SH tg "❌ 자동으로 못 고쳤어요 - 확인이 필요해요

          어디서: 웹사이트 도메인 동기화 (vercel-domain-sync)
          이유: ${WHY:-워크플로가 도중에 멈췄어요}
          그래서: 사이트·크론이 옛 배포에 멈춰 있을 수 있어요. 다음 커밋이 올라오면 다시 시도하고, 되면 ✅로 알려드려요.
          로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
