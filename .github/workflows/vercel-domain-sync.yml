# Vercel 프로덕션 도메인 자동 재연결.
#
# 프로젝트를 momitemmom 으로 리네임하면서 momitemmom.vercel.app 도메인이
# Vercel 의 "새 배포마다 자동 갱신" 목록에서 빠졌다(내부 링크 유실 - 리네임 버그).
# 그래서 빌드/배포는 항상 성공하는데 실제 도메인은 예전 배포에 멈춰 있었다.
#
# 완전한 근본 수정(도메인 삭제 후 재등록)은 순간적으로 사이트가 내려갈 수 있어
# 보류하고, 대신 이 워크플로가 푸시마다 최신 프로덕션 배포를 찾아
# momitemmom.vercel.app 에 재연결한다(`vercel alias set`) - 다운타임 없음.
#
# 필요한 것: 저장소 Settings → Secrets and variables → Actions 에
#   VERCEL_TOKEN = Vercel 개인 액세스 토큰 (https://vercel.com/account/tokens)
# 이 시크릿이 없으면 아무것도 하지 않고 조용히 종료한다.

name: vercel-domain-sync

on:
  workflow_dispatch:
  push:
    branches:
      - claude/coupang-partners-shortform-hinfcb

# project/team id 는 비밀정보 아님(공개 식별자) - 시크릿 아닌 값으로 둔다.
env:
  VERCEL_PROJECT_ID: prj_fToV2H7YJsGLIIQPdr7EhzrepHVl
  VERCEL_TEAM_SCOPE: rmsduddl200-2456s-projects
  VERCEL_TEAM_ID: team_K9RrJcr1OyeJodEA9g34IAKO
  VERCEL_DOMAIN: momitemmom.vercel.app

jobs:
  sync-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 토큰 확인
        id: check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "VERCEL_TOKEN 시크릿이 없어 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 이 커밋의 배포가 준비될 때까지 대기 후 도메인 재연결
        if: steps.check.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -e
          echo "커밋 $GIT_SHA 의 Vercel 배포 대기 중..."
          URL=""
          for i in $(seq 1 90); do
            RESP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=10&teamId=$VERCEL_TEAM_ID")
            URL=$(GIT_SHA="$GIT_SHA" node -e "
              const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const sha = process.env.GIT_SHA;
              const dep = (data.deployments || []).find(
                (d) => d.meta && d.meta.githubCommitSha === sha && d.state === 'READY'
              );
              if (dep) process.stdout.write(dep.url);
            " <<< "$RESP")
            DEP_ID=$(GIT_SHA="$GIT_SHA" node -e "
              const data = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const sha = process.env.GIT_SHA;
              const dep = (data.deployments || []).find(
                (d) => d.meta && d.meta.githubCommitSha === sha && d.state === 'READY'
              );
              if (dep) process.stdout.write(dep.uid || dep.id || '');
            " <<< "$RESP")
            if [ -n "$URL" ]; then
              echo "배포 준비됨: $URL"
              break
            fi
            echo "[$i/90] 아직 준비 안 됨 - 10초 후 재시도"
            sleep 10
          done

          if [ -z "$URL" ]; then
            # 여기서 exit 0 하면 잡이 green 이라 아래 실패 알림이 안 울린다.
            # 이 워크플로가 옛 배포 장애를 막는 유일한 안전장치인데, 조용히
            # 넘어가면 사이트·크론이 옛 코드에 멈춘 걸 아무도 모른다(실제로
            # 2026-08-21 까지 크론이 옛 배포로 돌고 있었다). 반드시 실패시킨다.
            echo "::error::15분 내에 배포가 준비되지 않아 도메인 재연결·프로덕션 승격을 못 했습니다."
            exit 1
          fi

          npm install -g vercel@latest --no-progress >/dev/null 2>&1
          vercel alias set "https://$URL" "$VERCEL_DOMAIN" \
            --token="$VERCEL_TOKEN" --scope="$VERCEL_TEAM_SCOPE"
          echo "✅ $VERCEL_DOMAIN → $URL 연결 완료"

          # 도메인만 바꾸면 크론이 안 따라온다.
          #
          # Vercel 크론은 "프로젝트의 현재 프로덕션 배포"에서 실행되는데, alias set 은
          # 도메인이 가리키는 곳만 바꾸고 그 포인터는 건드리지 않는다. 그래서 사이트는
          # 최신인데 크론은 옛 배포 코드로 돌았다 - 실측 2026-08-21: 큐잉이 계속 3편
          # (옛 하드코딩 상수)이었고, 이미 지운 키워드로 상품이 등록됐다.
          # 배포를 프로덕션으로 승격시켜 둘을 다시 맞춘다.
          if [ -n "$DEP_ID" ]; then
            CODE=$(curl -s -o /tmp/promote.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$DEP_ID?teamId=$VERCEL_TEAM_ID")
            if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
              echo "✅ 프로덕션 승격 완료 ($DEP_ID) - 크론이 이 코드로 돈다"
            else
              echo "::error::프로덕션 승격 실패(HTTP $CODE) - 크론이 옛 배포로 돕니다"
              cat /tmp/promote.json || true
              exit 1
            fi
          else
            echo "::error::배포 ID를 못 찾아 프로덕션 승격을 건너뜁니다"
            exit 1
          fi

      # 실패 시 텔레그램 알림 (웹사이트가 옛 버전에 멈추는 문제 조기 감지)
      - name: 실패 시 텔레그램 알림
        if: failure()
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: |
          BOT=$(printf '%s\n' "$WORKER_ENV" | grep '^TELEGRAM_BOT_TOKEN=' | cut -d= -f2-)
          CHAT=$(printf '%s\n' "$WORKER_ENV" | grep '^TELEGRAM_ALLOWED_CHAT_ID=' | cut -d= -f2-)
          if [ -n "$BOT" ] && [ -n "$CHAT" ]; then
            curl -s -o /dev/null -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
              --data-urlencode "chat_id=${CHAT}" \
              --data-urlencode "text=🚨 시스템 문제 발생

          어디서: 웹사이트 도메인 동기화 (vercel-domain-sync)
          무엇이: 사이트/크론이 옛 배포에 멈췄을 수 있음 (도메인 재연결 또는 프로덕션 승격 실패)
          로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
