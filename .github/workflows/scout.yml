# 상품 스카우트 (하루 2회).
#
# Vercel Cron(Hobby)은 크론당 하루 1회만 돌릴 수 있어서, 재고를 더 빨리 쌓으려면
# 여기서 돌린다. Vercel 쪽 /api/cron/scout(하루 1회)는 그대로 두고 이걸 추가로
# 돌리는 구조 - 같은 상품은 중복으로 걸러지므로 겹쳐도 문제되지 않는다.
#
# 필요한 것: WORKER_ENV 시크릿 (렌더 워커와 동일, COUPANG_ACCESS_KEY/SECRET_KEY 포함)
#
# 수동 실행: Actions 탭 → scout → Run workflow

name: scout

on:
  workflow_dispatch:
  schedule:
    # KST 06:40 / 15:20 (UTC 21:40 / 06:20)
    # 06:40 은 첫 업로드 슬롯(07:30~)보다 앞서야 그날 영상이 제때 큐잉된다.
    - cron: "40 21 * * *"
    - cron: "20 6 * * *"

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 워커 환경변수 확인
        id: check
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: |
          if [ -z "$WORKER_ENV" ]; then
            echo "WORKER_ENV 시크릿이 없어 스카우트를 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: .env.local 생성 (시크릿에서)
        if: steps.check.outputs.ready == 'true'
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: printf '%s\n' "$WORKER_ENV" > .env.local

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: node_modules 캐시
        if: steps.check.outputs.ready == 'true'
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 의존성 설치
        if: steps.check.outputs.ready == 'true' && steps.cache.outputs.cache-hit != 'true'
        run: npm ci

      # 어떤 자격증명이 러너에 실려 있는지 (값이 아니라 "있다/없다"만) 확인한다.
      # 렌더 워커용 WORKER_ENV 에는 쿠팡 키가 없을 수 있어서(스카우트는 원래
      # Vercel 에서만 돌았다) 어느 경로로 스카우트할지 여기서 갈린다.
      - name: 자격증명 확인
        if: steps.check.outputs.ready == 'true'
        id: creds
        run: |
          have() { grep -q "^$1=." .env.local && echo yes || echo no; }
          echo "COUPANG_ACCESS_KEY=$(have COUPANG_ACCESS_KEY)"
          echo "COUPANG_SECRET_KEY=$(have COUPANG_SECRET_KEY)"
          echo "CRON_SECRET=$(have CRON_SECRET)"
          echo "NEXT_PUBLIC_SITE_URL=$(have NEXT_PUBLIC_SITE_URL)"
          echo "coupang=$(have COUPANG_ACCESS_KEY)" >> "$GITHUB_OUTPUT"
          echo "cron=$(have CRON_SECRET)" >> "$GITHUB_OUTPUT"

      # 큐잉은 자격증명과 무관하게 항상 돌린다 (Supabase 만 있으면 된다).
      #
      # Vercel 크론도 큐잉을 하지만, 이 프로젝트는 "도메인이 가리키는 배포"와
      # "Vercel 이 프로덕션으로 아는 배포"가 갈라져 있어 크론이 옛 코드로 돈다
      # (vercel-domain-sync.yml 주석 참고). 실측 2026-08-21: 큐잉이 계속 3편으로
      # 고정돼 있었다(옛 하드코딩 상수). Actions 는 브랜치를 그대로 쓰므로 항상
      # 최신이다. 멱등이라 크론과 겹쳐도 하루 목표치를 넘기지 않는다.
      - name: 하루치 영상 큐잉
        if: steps.check.outputs.ready == 'true'
        run: npm run queue

      # 경로 A: 러너에 쿠팡 키가 있으면 여기서 직접 수집한다.
      - name: 스카우트 실행 (직접)
        if: steps.check.outputs.ready == 'true' && steps.creds.outputs.coupang == 'yes'
        run: npm run scout

      # 경로 B: 쿠팡 키가 없으면 배포된 사이트의 스카우트 엔드포인트를 호출한다
      # (쿠팡 키는 Vercel 환경변수에만 있다). CRON_SECRET 으로 인증한다.
      - name: 스카우트 실행 (배포 엔드포인트 호출)
        if: steps.check.outputs.ready == 'true' && steps.creds.outputs.coupang != 'yes' && steps.creds.outputs.cron == 'yes'
        run: |
          SITE=$(grep '^NEXT_PUBLIC_SITE_URL=' .env.local | cut -d= -f2- | tr -d '\r' | sed 's:/*$::')
          SECRET=$(grep '^CRON_SECRET=' .env.local | cut -d= -f2- | tr -d '\r')
          [ -n "$SITE" ] || { echo "NEXT_PUBLIC_SITE_URL 이 없어 호출할 주소를 모릅니다"; exit 1; }
          code=$(curl -sS -o /tmp/scout.out -w '%{http_code}' \
            -H "Authorization: Bearer $SECRET" "$SITE/api/cron/scout")
          echo "HTTP $code"; cat /tmp/scout.out; echo
          [ "$code" = "200" ]

      # 자격증명이 없으면 조용히 건너뛴다(실패로 두면 하루 2번씩 실패 알림만 쌓인다).
      # 이 경우에도 Vercel 크론의 하루 1회 스카우트는 정상 동작한다.
      - name: 자격증명 없음 안내
        if: steps.check.outputs.ready == 'true' && steps.creds.outputs.coupang != 'yes' && steps.creds.outputs.cron != 'yes'
        run: |
          echo "::notice::러너에 쿠팡 키도 CRON_SECRET 도 없어 이번 스카우트는 건너뜁니다."
          echo "하루 2회 수집을 켜려면 WORKER_ENV 시크릿에 CRON_SECRET 한 줄을 추가하세요"
          echo "(Vercel 환경변수의 CRON_SECRET 과 같은 값). Vercel 크론의 하루 1회 수집은 계속 동작합니다."
