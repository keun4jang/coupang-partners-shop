# 일회성 진단 스크립트 실행 - 허용 목록에 있는 것만.
#
# 운영 DB·쿠팡 API 자격증명이 필요한 확인(예: 서브ID 귀속 진단)을 로컬 없이
# 돌리기 위한 것. 스크립트는 읽기 위주이고, 무엇을 호출하는지 각 파일 머리말에
# 적어 둔다. 목록에 새 스크립트를 넣을 때도 그 원칙을 지킨다.
#
# 실행: Actions 탭 → diag → Run workflow

name: diag

on:
  workflow_dispatch:
    inputs:
      script:
        description: "실행할 진단"
        required: true
        type: choice
        options:
          - subid-probe
          - google-keys-probe
          - longform-report
          - publish-status

concurrency:
  group: diag
  cancel-in-progress: false

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 워커 환경변수 확인
        id: check
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: |
          if [ -z "$WORKER_ENV" ]; then
            echo "WORKER_ENV 시크릿이 없어 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: .env.local 생성 (시크릿에서)
        if: steps.check.outputs.ready == 'true'
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: printf '%s\n' "$WORKER_ENV" > .env.local

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: node_modules 캐시
        if: steps.check.outputs.ready == 'true'
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 의존성 설치
        if: steps.check.outputs.ready == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: 진단 실행
        if: steps.check.outputs.ready == 'true'
        env:
          SCRIPT: ${{ github.event.inputs.script }}
        run: |
          set -o pipefail
          npx tsx "scripts/${SCRIPT}.ts" 2>&1 | tee diag.log
          { echo '```'; cat diag.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
