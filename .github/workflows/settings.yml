# 운영 설정(app_settings) 한 줄 바꾸기 - 허용된 키만 (scripts/set-setting.ts).
#
# 디자인 전환(D↔E)·하루 발행 편수처럼 DB 값 하나로 켜고 끄게 만든 스위치를
# Supabase 대시보드에 들어가지 않고 바꾸기 위한 것. 값을 비우면 조회만 한다.
#
# 실행: Actions 탭 → settings → Run workflow

name: settings

on:
  workflow_dispatch:
    inputs:
      key:
        description: "바꿀 설정"
        required: true
        type: choice
        options:
          - design_template
          - daily_video_target
          - d_product_first
          - longform_topic_once
          - own_product_daily
      value:
        description: "새 값 (비우면 현재 값만 조회). design_template: D 또는 E / daily_video_target: 1~12 / d_product_first: on 또는 off"
        required: false
        default: ""

concurrency:
  group: settings
  cancel-in-progress: false

jobs:
  set:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 워커 환경변수 확인
        id: check
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: |
          if [ -z "$WORKER_ENV" ]; then
            echo "WORKER_ENV 시크릿이 없어 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: .env.local 생성 (시크릿에서)
        if: steps.check.outputs.ready == 'true'
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: printf '%s\n' "$WORKER_ENV" > .env.local

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: node_modules 캐시
        if: steps.check.outputs.ready == 'true'
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 의존성 설치
        if: steps.check.outputs.ready == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: 설정 변경
        if: steps.check.outputs.ready == 'true'
        env:
          KEY: ${{ github.event.inputs.key }}
          VALUE: ${{ github.event.inputs.value }}
        run: |
          set -o pipefail
          npx tsx scripts/set-setting.ts "$KEY" "$VALUE" 2>&1 | tee settings.log
          { echo '```'; cat settings.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
