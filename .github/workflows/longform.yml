# 유튜브 롱폼 "TOP10" 워커 (매일 새벽, 매일 다른 무작위 시각에 실행 - 사장님
# 방침: 세부 키워드를 매일 로테이션으로 돌려 매일 다른 컨텐츠를 만든다.
# src/lib/longform.ts selectTop10 참고).
#
# 이 크론은 10분마다 깨어나기만 하고, worker/longform-worker.ts 가
# shouldRunLongformToday() 로 "이번엔 쉬어감"(오늘의 무작위 목표 시각이 아직
# 안 됐거나, 발행 간격이 안 찼음)을 스스로 판단한다(idempotent -
# scout.yml/render.yml 과 같은 철학). app_settings.longform_interval_days 로
# 발행 간격을 조정할 수 있다(기본 1일 = 매일).
#
# 시각을 숏폼 첫 업로드 슬롯(07:30 KST)보다 앞에 둔 이유: 롱폼과 숏폼이 같은
# 유튜브 채널의 같은 일일 무료 할당량(10,000 units)을 나눠 쓰는데, 워커가
# "오늘 첫 업로드일 때만 진행"으로 스스로 양보하기 때문이다(worker/longform-worker.ts
# 주석 참고). 이 크론이 숏폼보다 늦으면 매번 양보만 하다 끝난다.
#
# 공개 여부: 2026-08-24 첫 실제 업로드(청소용품 TOP10)를 사장님이 검수 후
# "전체공개로 진행하자"고 승인해, 예약 실행(schedule)도 기본 전체공개(public)로
# 올린다. workflow_dispatch(수동 실행)는 반대로 기본이 비공개(unlisted)다 -
# 이후 로직을 바꿔서 다시 검수가 필요할 때 안전하게 수동 테스트할 수 있게.
#
# 필요한 것: 저장소 Settings → Secrets and variables → Actions 에
#   WORKER_ENV = .env.local 형식의 워커용 환경변수 전체 (render.yml 과 동일 시크릿)
# 이 시크릿이 없으면 아무것도 하지 않고 조용히 종료한다.
#
# 수동 실행: Actions 탭 → longform-worker → Run workflow

name: longform-worker

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "체크하면 전체공개(public)로 업로드. 체크 안 하면 비공개(unlisted) - 검수용"
        type: boolean
        default: false
      force:
        description: "재고/주기 판정 무시하고 강행 (수동 테스트용)"
        type: boolean
        default: false
  schedule:
    # 10분마다 깨어나 "오늘의 무작위 목표 시각(KST 05:20~06:50)이 됐는지"만
    # 확인한다(worker/longform-worker.ts shouldRunLongformToday 참고) - 매일
    # 정확히 같은 시각(예: 06:00 정각)에 올라가면 봇 티가 나서(사장님 2026-08-24:
    # "업로드 시간은 매일 다르게 해야해"), 날짜로 결정되는 의사난수 목표 시각을
    # 매일 다르게 고르고 그 근처 틱에서 실제로 실행한다 - 숏폼 UPLOAD_SCHEDULE
    # 의 "범위" 표기와 같은 방식. 목표 시각이 아직이면 몇 초 만에 조용히 끝난다.
    # 창은 숏폼 첫 업로드 슬롯(07:30 KST)보다 앞서야 유튜브 할당량 양보 로직이 돈다.
    - cron: "*/10 20,21 * * *"

concurrency:
  group: longform-worker
  cancel-in-progress: false

jobs:
  longform:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 워커 환경변수 확인
        id: check
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: |
          if [ -z "$WORKER_ENV" ]; then
            echo "WORKER_ENV 시크릿이 없어 건너뜁니다."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: .env.local 생성 (시크릿에서)
        if: steps.check.outputs.ready == 'true'
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: printf '%s\n' "$WORKER_ENV" > .env.local

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: node_modules 캐시
        if: steps.check.outputs.ready == 'true'
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 의존성 설치
        if: steps.check.outputs.ready == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Remotion 브라우저 준비
        if: steps.check.outputs.ready == 'true'
        run: npx remotion browser ensure

      - name: TOP10 롱폼 생성/업로드
        if: steps.check.outputs.ready == 'true'
        # LONGFORM_UPLOAD_OK: 실제 유튜브 업로드를 허용하는 잠금(worker/longform-worker.ts
        # 참고) - 이 워크플로 파일 안에서만 "1" 이고, 로컬 개발환경에는 이 값이
        # 없으므로 실수로 로컬에서 돌려도 업로드까지 가지 않는다.
        env:
          LONGFORM_UPLOAD_OK: "1"
        run: |
          # 예약 실행(schedule)은 기본 전체공개. 수동 실행(workflow_dispatch)은
          # 기본 비공개(unlisted) - publish 체크박스를 눌러야 전체공개된다.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS=""
            [ "${{ inputs.publish }}" = "true" ] && ARGS="$ARGS --publish"
            [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          else
            ARGS="--publish"
          fi
          npm run longform -- $ARGS

      - name: 실패 시 텔레그램 알림
        if: failure() && steps.check.outputs.ready == 'true'
        run: |
          [ -f .env.local ] || exit 0
          BOT=$(grep '^TELEGRAM_BOT_TOKEN=' .env.local | cut -d= -f2-)
          CHAT=$(grep '^TELEGRAM_ALLOWED_CHAT_ID=' .env.local | cut -d= -f2-)
          if [ -n "$BOT" ] && [ -n "$CHAT" ]; then
            curl -s -o /dev/null -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
              --data-urlencode "chat_id=${CHAT}" \
              --data-urlencode "text=🚨 시스템 문제 발생

          어디서: 롱폼 워커 (GitHub Actions)
          무엇이: TOP10 영상 생성/업로드 실행 실패
          로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
