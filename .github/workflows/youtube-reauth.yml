# 유튜브 토큰 재발급 (분석 권한 추가) - scripts/youtube-reauth.ts 머리말 참고.
#
#   1) step=url 로 실행 → 실행 페이지 Summary 의 동의 링크를 채널 계정으로 열어 동의
#   2) "localhost 연결 실패" 페이지 주소창 전체를 복사
#   3) step=exchange, code=<복사한 주소> 로 바로 다시 실행 (code 는 몇 분 안에 만료)
#
# 새 토큰에 force-ssl·분석 권한이 모두 있을 때만 저장하고, 아니면 기존 토큰을 둔다.

name: youtube-reauth

on:
  workflow_dispatch:
    inputs:
      step:
        description: "url = 동의 링크 발급 / exchange = 코드 교환·저장"
        required: true
        type: choice
        options:
          - url
          - exchange
      code:
        description: "exchange 때만: 동의 후 주소창 전체(또는 code 값)"
        required: false
        default: ""

concurrency:
  group: youtube-reauth
  cancel-in-progress: false

jobs:
  reauth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 워커 환경변수 확인
        id: check
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: |
          if [ -z "$WORKER_ENV" ]; then
            echo "WORKER_ENV 시크릿이 없어 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: .env.local 생성 (시크릿에서)
        if: steps.check.outputs.ready == 'true'
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: printf '%s\n' "$WORKER_ENV" > .env.local

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: node_modules 캐시
        if: steps.check.outputs.ready == 'true'
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 의존성 설치
        if: steps.check.outputs.ready == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: 재발급
        if: steps.check.outputs.ready == 'true'
        env:
          STEP: ${{ github.event.inputs.step }}
          CODE: ${{ github.event.inputs.code }}
        run: |
          set -o pipefail
          npx tsx scripts/youtube-reauth.ts "$STEP" "$CODE" 2>&1 | tee reauth.log
          { echo '```'; cat reauth.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
