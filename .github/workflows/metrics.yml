# 링크 성과(클릭률) 리포트를 실행 페이지에 찍는다.
#
# 왜 필요한가: 지금까지 이 숫자를 보려면 사장님이 텔레그램에 "클릭률"을 쳐서
# 결과를 복사해 옮겨야 했다. 봇 필터 효과 확인처럼 며칠 간격으로 같은 숫자를
# 다시 봐야 하는 일이 반복되는데, 그때마다 사람 손이 한 번씩 들어갔다.
# 여기서 돌리면 Summary 에 그대로 뜬다.
#
# 아무것도 바꾸지 않는다. 읽기 전용 리포트다.
#
# 실행: Actions 탭 → metrics → Run workflow

name: metrics

on:
  workflow_dispatch:
    inputs:
      days:
        description: "집계 기간(일). 기본 7"
        required: false
        default: "7"
      views:
        description: "유튜브 조회수도 같이 볼지 (true/false)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 워커 환경변수 확인
        id: check
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: |
          if [ -z "$WORKER_ENV" ]; then
            echo "WORKER_ENV 시크릿이 없어 리포트를 건너뜁니다." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: .env.local 생성 (시크릿에서)
        if: steps.check.outputs.ready == 'true'
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
        run: printf '%s\n' "$WORKER_ENV" > .env.local

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: node_modules 캐시
        if: steps.check.outputs.ready == 'true'
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 의존성 설치
        if: steps.check.outputs.ready == 'true' && steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: 리포트
        if: steps.check.outputs.ready == 'true'
        env:
          DAYS: ${{ github.event.inputs.days }}
        run: |
          set -o pipefail
          npx tsx scripts/metrics-links.ts "${DAYS:-7}" 2>&1 | tee metrics.log

      - name: 유튜브 조회수 (선택)
        if: steps.check.outputs.ready == 'true' && github.event.inputs.views == 'true'
        # 조회수를 봐야 "안 본다"와 "보는데 안 누른다"가 갈린다. 링크 리포트만
        # 보면 둘이 똑같이 "클릭 0"으로 보인다.
        # videos.list 는 50개당 1유닛이라 하루 10,000 유닛 중 티도 안 난다.
        run: |
          set -o pipefail
          npx tsx scripts/measure-views.ts 2>&1 | tee -a metrics.log

      - name: 결과를 실행 페이지에 표시
        if: steps.check.outputs.ready == 'true' && always()
        run: |
          {
            echo "## 링크 성과 리포트 (최근 ${{ github.event.inputs.days || '7' }}일)"
            echo ""
            echo '```'
            tail -n 300 metrics.log 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
